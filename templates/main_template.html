{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}فروشگاه{% endblock title %}</title>

  <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}">

  <link rel="stylesheet" href="{% static 'vendor/bootstrap-4.5.3/css/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'vendor/owl-carousel-2.3.4/assets/owl.carousel.min.css' %}">
  <link rel="stylesheet" href="{% static 'vendor/fontawesome-5.6.3/css/all.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="stylesheet" href="{% static 'css/custom.css' %}">

  <script src="{% static 'vendor/jquery-3.6.0/jquery.min.js' %}"></script>
  <script src="{% static 'vendor/bootstrap-4.5.3/js/bootstrap.bundle.min.js' %}"></script>
  <script src="{% static 'vendor/owl-carousel-2.3.4/owl.carousel.min.js' %}"></script>
  <script src="{% static 'js/number.js' %}"></script>
  <script src="{% static 'js/main.js' %}"></script>
  <script src="{% static 'js/myscript.js' %}"></script>
  <script src="{% static 'js/shop-actions.js' %}" defer></script>
  <script src="{% static 'js/hero-slider.js' %}" defer></script>
</head>
<body>
  {% include "partials/header.html" %}
  {% include "partials/messages.html" %}
  {% block content %}{% endblock content %}
  {% include "partials/footer.html" %}
</body>
</html>
