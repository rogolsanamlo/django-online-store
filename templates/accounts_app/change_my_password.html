{% extends "user_panel_template.html" %}

{% block panel %}
<div class="card">
  <div class="card-header"><h5>تغییر رمز عبور</h5></div>
  <div class="card-divider"></div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary mt-2">ذخیره‌ی رمز عبور</button>
    </form>
  </div>
</div>
{% endblock panel %}
