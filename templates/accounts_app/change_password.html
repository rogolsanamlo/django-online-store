{% extends "main_template.html" %}
{% load static %}

{% block content %}
    <div class="site__body">
        <div class="page-header">
            <div class="page-header__container container">
                <div class="page-header__breadcrumb">
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item">
                                <a href="{% url 'main:index' %}">خانه</a>
                                /
                            </li>
                            <li class="breadcrumb-item">
                                <a href="#">حساب کاربری</a>
                                /
                            </li>
                            <li class="active" aria-current="page">
                                تغییر رمز عبور حساب کاربری
                            </li>
                        </ol>
                    </nav>
                </div>
                <div class="page-header__title d-flex justify-content-center">
                    <h1>تغییر رمز عبور حساب کاربری جدید</h1>
                </div>
            </div>
        </div>
        <div class="block">
            <div class="container">
                <div class="row d-flex justify-content-center">
                    <div class="col-md-6 d-flex mt-4 mt-md-0">
                        <div class="card flex-grow-1 mb-0">
                            <div class="card-body">
                                <h3 class="card-title">تغییر رمز</h3>

                                <form method="post">
                                    {% csrf_token %}
                                    {{ form.as_p }}
                                    <input type="submit" value="ثبت تغییرات" class="btn btn-primary">
                                </form>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock content %}
